name: Propagate to fleet

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dispatch bump event to all consumers
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT }}
        run: |
          REPOS=(
            Boss-Effect-Reminder
            Death-Effect-Reminder
            Foundry-Module-Template
            Me-Beloved-SHIP
            Pirate-Borg-Crew-and-Ship-Manager
            Weapon-Mastery-Effects-Reminder
            alpha-5-bot
            brightbeard-adventure-module
            cabin-fever-classes-module
            chaos-survival-mode
            character-vault-web
            death-effect-reminder-dnd5e
            death-effect-reminder-pf2e
            death-effect-reminder-pirateborg
            death-ledger
            digi-dm-screen
            farsight-importer-ext
            fh-actually-private-rolls
            foundry-adventure-module-template
            foundry-character-vault-module
            foundry-mcp
            foundry-mob-actor
            futurehax-cms
            futurehax-module-doctor
            futurehax-next-doctor
            futurehax-website
            item-piles-pirateborg-module
            itch-mcp
            jolly-rogenerator
            jolly-rogenerator-classes-module
            jr-foundry-bridge
            monster-card-generator
            nextjs-webapp-template
            night-of-the-drac-o-lantern-module
            obsidian-homebrewery-renderer
            patreon-mcp
            pb-combat-helper-overlay
            pb-derelict-staging
            pb-dice-themes
            pb-job-board
            pb-naval-combat-overlay
            pb-pirate-forge
            pb-potion-bench
            pb-ready-set-roll
            pb-sea-travel
            pb-shanty-engine
            pb-storm-generator
            pb-suite-manager
            pb-tavern-plus
            pb-treasure-staging
            pb-wind-manager
            pirate-borg-content-importer-module
            pirate-borg-loot-sheet-npc
            player-perspective
            saltwater-sacrament-module
            scattered-seafloor-module
            selective-sight
            soft-lights
            zordon
          )

          COMMIT_SHA="${{ github.sha }}"
          for repo in "${REPOS[@]}"; do
            echo "Dispatching to FutureHax/$repo..."
            gh api "repos/FutureHax/$repo/dispatches" \
              -f event_type=bump-shared-tooling \
              -f "client_payload[sha]=$COMMIT_SHA" \
              || echo "  WARN: dispatch failed for $repo"
          done
          echo "Done. Dispatched to ${#REPOS[@]} repos."
